<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Space+Grotesk:wght@500;700&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="kit.css" />
  </head>
  <body>
    <div id="stage">
      <!-- Hook : l'écart réel entre la plus chère et la moins chère -->
      <div class="scene">
        <h1 class="hook-title a" data-in="0.1" data-out="4.7">Même ville.</h1>
        <h1 class="hook-title a" data-in="0.6" data-out="4.7">Même gazole.</h1>
        <div class="prices">
          <div class="price a" data-in="1.4" data-out="4.7" data-dx="-120">
            <span class="lbl">La plus chère</span
            ><span class="val" style="color: var(--bad)"
              >2,669<small>€/L</small></span
            >
          </div>
          <div class="price a" data-in="2.0" data-out="4.7" data-dx="120">
            <span class="lbl">La moins chère</span
            ><span class="val" style="color: var(--good)"
              >2,240<small>€/L</small></span
            >
          </div>
        </div>
        <div class="gap h a" data-in="2.8" data-out="4.7">
          <b><span id="count">21</span> €</b> d'écart<br />sur un plein.
        </div>
        <div class="foot a" data-in="1.4" data-out="4.7" data-dy="0">
          Gazole · plein de 50 L · 20 km autour de Lyon · 5 oct. 2026
        </div>
      </div>

      <!-- La vraie app (captures de la prod) -->
      <div id="cam">
        <div id="phone">
          <img src="shots/explore-0.png" alt="" />
          <img id="s1" src="shots/e1-prix.png" alt="" />
          <!-- Tiroir : capture de la liste étendue, rognée au bord haut du tiroir (343 px) -->
          <img
            id="drawer"
            src="shots/e2-expanded.png"
            alt=""
            style="clip-path: inset(343px 0 0 0 round 16px 16px 0 0)"
          />
          <div
            class="ring"
            id="ring"
            style="left: 27px; top: 815px; width: 718px; height: 162px"
          ></div>
          <img id="s3" src="shots/e3-detail.png" alt="" />
          <div class="tap" id="tap1" style="left: 271px; top: 1196px"></div>
          <div class="tap" id="tap2" style="left: 386px; top: 897px"></div>
        </div>
      </div>
      <div id="band"></div>
      <div class="cap h a" data-in="8.2" data-out="11.7">
        Toutes les stations<br /><span class="soft">autour de vous.</span>
      </div>
      <div class="cap h a" data-in="12.1" data-out="16.6">
        Triées par prix.<br /><span class="soft"
          >La moins chère en premier.</span
        >
      </div>
      <div class="cap h a" data-in="17.1" data-out="22.2">
        Itinéraire inclus.<br /><span class="soft"
          >Le meilleur prix à 13 min.</span
        >
      </div>
    </div>

    <script src="theme.js"></script>
    <script src="kit.js"></script>
    <script>
      defineVideo({
        duration: 27,
        poster: 26,
        stills: [
          1.0, 2.5, 4.5, 6.5, 8.5, 10.5, 11.2, 12.6, 14.0, 16.0, 16.95, 17.5,
          20.8, 22.7, 23.3, 26,
        ],
        reveal: { in: 5, out: 7.7, tag: "La moins chère, près de chez vous." },
        outro: {
          in: 22.5,
          punch:
            'Le plein, oui.<br><span class="soft">Plein tarif, non.</span>',
        },
        cues: {
          arp: 8,
          clap: 12,
          taps: [10.8, 16.8],
          whooshes: [
            [4.0, 1.0, 0.25],
            [7.9, 0.8, 0.12],
            [12.15, 0.8, 0.14],
            [22.1, 0.5, 0.14],
          ],
          bells: [
            [0.1, 57, 0.05, 0.6],
            [0.6, 60, 0.05, 0.6],
            [1.4, 76, 0.07, 0.35],
            [2.0, 69, 0.07, 0.35],
            [2.8, 69, 0.05, 0.3],
            [2.9, 72, 0.05, 0.3],
            [3.0, 76, 0.05, 0.3],
            [13.2, 81, 0.06, 0.5],
            [13.3, 88, 0.05, 0.6],
            [18.3, 84, 0.04, 0.8],
          ],
        },
        tick(t, K) {
          K.$("count").textContent = Math.round(21 * K.out3(K.p(t, 2.8, 3.4)));
          K.phone(t, {
            enter: 8,
            exit: 22.4,
            zooms: [
              {
                from: 13.8,
                to: 15.6,
                back: 16.2,
                s: 1.16,
                origin: "386px 897px",
              }, // vers la 1re carte
              { from: 18.3, to: 20.5, s: 1.3, origin: "417px 620px" }, // vers l'itinéraire
            ],
          });
          K.$("s1").style.opacity = K.p(t, 10.95, 11.02); // tap « Prix » → Les plus économiques
          K.$("drawer").style.opacity = t >= 12.2 ? 1 : 0;
          K.$("drawer").style.transform =
            `translateY(${624 * (1 - K.inOut(K.p(t, 12.2, 13.0)))}px)`;
          K.ring(K.$("ring"), t, 13.2);
          K.$("s3").style.opacity = K.p(t, 17.0, 17.08); // tap sur la station → détail + itinéraire
          K.tap(K.$("tap1"), t, 10.8);
          K.tap(K.$("tap2"), t, 16.8);
        },
      });
    </script>
  </body>
</html>
